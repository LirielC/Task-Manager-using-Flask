name: CI

on:
  push:
    branches:
      - main
      - develop
      - staging
      - production
  pull_request:
    branches:
      - main
      - develop
      - staging
      - production

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

  sast_bandit:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Create report directory
        run: mkdir -p reports/bandit

      - name: Run Bandit JSON report
        run: bandit -r . -f json -o reports/bandit/bandit-report.json || true

      - name: Run Bandit HTML report
        run: bandit -r . -f html -o reports/bandit/bandit-report.html || true

      - name: Upload Bandit reports
        uses: actions/upload-artifact@v4
        with:
          name: bandit-reports
          path: reports/bandit
          if-no-files-found: warn

  dependency_check:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create report directory
        run: mkdir -p reports/dependency-check

      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "task-manager-flask"
          path: "."
          format: "HTML"
          out: "reports/dependency-check"
          args: >
            --enableRetired
            --noupdate

      - name: Upload Dependency-Check report
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: reports/dependency-check
          if-no-files-found: warn

  monitoring_check:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate monitoring compose file
        run: docker compose -f docker-compose.monitoring.yml config

  build:
    needs:
      - test
      - sast_bandit
      - dependency_check
      - monitoring_check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t task-manager-flask:latest .

  review_app:
    if: github.event_name == 'pull_request'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t task-manager-flask:latest .

      - name: Start review app
        run: docker run -d --name task-manager-flask-review -p 8080:8080 task-manager-flask:latest

      - name: List review containers
        run: docker ps

      - name: Wait for application
        run: |
          for i in {1..20}; do
            if curl -fsS http://localhost:8080 >/dev/null; then
              exit 0
            fi
            sleep 3
          done
          docker logs task-manager-flask-review
          exit 1

      - name: Validate review app
        run: curl -fsS http://localhost:8080

      - name: Stop review app
        if: always()
        run: |
          docker stop task-manager-flask-review || true
          docker rm task-manager-flask-review || true

  deploy_stage:
    if: github.ref == 'refs/heads/staging'
    needs: build
    runs-on: ubuntu-latest
    environment: stage

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t task-manager-flask:latest .

      - name: Start stage app
        run: docker run -d --name task-manager-flask-stage -p 8080:8080 task-manager-flask:latest

      - name: List stage containers
        run: docker ps

      - name: Wait for stage application
        run: |
          for i in {1..20}; do
            if curl -fsS http://localhost:8080 >/dev/null; then
              exit 0
            fi
            sleep 3
          done
          docker logs task-manager-flask-stage
          exit 1

      - name: Validate stage app
        run: curl -fsS http://localhost:8080

      - name: Stop stage app
        if: always()
        run: |
          docker stop task-manager-flask-stage || true
          docker rm task-manager-flask-stage || true

  dast_zap:
    if: github.ref == 'refs/heads/staging'
    needs: deploy_stage
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create report directory
        run: mkdir -p reports/zap

      - name: Build Docker image
        run: docker build -t task-manager-flask:latest .

      - name: Start app for DAST
        run: docker run -d --name task-manager-flask-zap -p 8080:8080 task-manager-flask:latest

      - name: List DAST containers
        run: docker ps

      - name: Wait for application
        run: |
          for i in {1..20}; do
            if curl -fsS http://localhost:8080 >/dev/null; then
              exit 0
            fi
            sleep 3
          done
          docker logs task-manager-flask-zap
          exit 1

      - name: Run OWASP ZAP baseline scan
        run: |
          docker run --rm -t \
            --network host \
            -v "$PWD:/zap/wrk" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:8080 -r reports/zap/zap-report.html || true

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: reports/zap
          if-no-files-found: warn

      - name: Stop app after DAST
        if: always()
        run: |
          docker stop task-manager-flask-zap || true
          docker rm task-manager-flask-zap || true
